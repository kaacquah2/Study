version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - ML_BACKEND_URL=http://ml-backend:8000
    depends_on:
      ml-backend:
        condition: service_healthy
    networks:
      - study-network

  ml-backend:
    build:
      context: ./ml_backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - APP_ENV=${APP_ENV:-production}
      - ML_BACKEND_API_KEY=${ML_BACKEND_API_KEY}
    volumes:
      # Persist FAISS vector store across container restarts
      - vector_store:/app/vector_store
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'' || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - study-network

networks:
  study-network:
    driver: bridge

volumes:
  # Named volume so FAISS index and docs.json survive ml-backend container restarts
  vector_store:
