version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
      - ML_BACKEND_URL=http://ml-backend:8000
    depends_on:
      - ml-backend

  ml-backend:
    build:
      context: ./ml_backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - APP_ENV=${APP_ENV:-development}
      - ML_BACKEND_API_KEY=${ML_BACKEND_API_KEY:-local-dev-key}
