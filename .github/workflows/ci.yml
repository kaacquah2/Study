name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-check:
    name: Frontend Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env File
        run: cp .env.example .env

      - name: SvelteKit Sync & Type Check
        run: npm run check

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit -- --run

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Integration Tests
        run: npm run test:e2e
        continue-on-error: true

  ml-backend-check:
    name: ML Backend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ML Backend Dependencies
        run: |
          cd ml_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Run Pytest Suite
        run: |
          cd ml_backend
          pytest test_ml_backend.py -v

      - name: Run Python Dependency Audit
        run: |
          cd ml_backend
          pip-audit --desc

  secret-scan:
    name: Secret Detection & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch || 'main' }}
          head: HEAD
          extra_args: --only-verified
